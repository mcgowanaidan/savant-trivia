<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — The Savant Trivia</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">THE <span>SAVANT</span> TRIVIA</div>
      <div class="auth-subtitle">Sign in to your league account</div>

      <div class="auth-toggle">
        <button class="active" id="tab-login">Sign in</button>
        <button id="tab-register">Create account</button>
      </div>

      <!-- LOGIN FORM -->
      <div id="form-login">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="login-email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" id="login-password" placeholder="••••••••" />
        </div>
        <div class="form-error" id="login-error"></div>
        <button class="btn btn-primary" style="width:100%;margin-top:8px;" id="login-btn">Sign in</button>
      </div>

      <!-- REGISTER FORM -->
      <div id="form-register" style="display:none;">
        <div class="form-group">
          <label class="form-label">Display name</label>
          <input type="text" class="form-input" id="reg-name" placeholder="Your name" />
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="reg-email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" id="reg-password" placeholder="Min. 6 characters" />
        </div>
        <div class="form-group">
          <label class="form-label">Account type</label>
          <select class="form-select" id="reg-role">
            <option value="player">Player</option>
            <option value="commissioner">Commissioner (league organizer)</option>
          </select>
        </div>
        <div class="form-error" id="reg-error"></div>
        <button class="btn btn-primary" style="width:100%;margin-top:8px;" id="reg-btn">Create account</button>
      </div>

      <div class="auth-divider">or</div>
      <a href="index.html" style="display:block;text-align:center;font-size:13px;color:var(--text-muted);">Continue without signing in →</a>
    </div>
  </div>

  <script type="module">
    import { login, registerUser } from "./js/auth.js";
    import { auth } from "./js/firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    onAuthStateChanged(auth, user => {
      if (user) window.location.href = "dashboard.html";
    });

    const tabLogin = document.getElementById("tab-login");
    const tabReg = document.getElementById("tab-register");
    const formLogin = document.getElementById("form-login");
    const formReg = document.getElementById("form-register");

    tabLogin.addEventListener("click", () => {
      tabLogin.classList.add("active"); tabReg.classList.remove("active");
      formLogin.style.display = "block"; formReg.style.display = "none";
    });
    tabReg.addEventListener("click", () => {
      tabReg.classList.add("active"); tabLogin.classList.remove("active");
      formReg.style.display = "block"; formLogin.style.display = "none";
    });

    document.getElementById("login-btn").addEventListener("click", async () => {
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;
      const err = document.getElementById("login-error");
      err.style.display = "none";
      try {
        await login(email, password);
        window.location.href = "dashboard.html";
      } catch (e) {
        err.textContent = "Invalid email or password.";
        err.style.display = "block";
      }
    });

    document.getElementById("reg-btn").addEventListener("click", async () => {
      const name = document.getElementById("reg-name").value.trim();
      const email = document.getElementById("reg-email").value.trim();
      const password = document.getElementById("reg-password").value;
      const role = document.getElementById("reg-role").value;
      const err = document.getElementById("reg-error");
      err.style.display = "none";
      if (!name || !email || !password) {
        err.textContent = "Please fill in all fields."; err.style.display = "block"; return;
      }
      try {
        await registerUser(email, password, name, role);
        window.location.href = "dashboard.html";
      } catch (e) {
        err.textContent = e.message || "Registration failed.";
        err.style.display = "block";
      }
    });
  </script>
</body>
</html>
